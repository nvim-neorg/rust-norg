[package]
name = "rust-norg"
version = "0.1.0"
edition = "2021"

[dependencies]
chumsky = "0.9.3"
itertools = "0.13.0"
serde = { version = "1.0.203", features = ["derive"] }
textwrap = "0.16.1"
unicode_categories = "0.1.1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
insta = { version = "1.39.0", features = ["yaml"] }
proptest = "1.4.0"

[profile.bench]
lto = true
codegen-units = 1

[[bench]]
name = "parser_benchmarks"
harness = false
